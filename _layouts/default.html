<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
{% include head.html %}
{% if page.layout == "post" %}
{% include head_post.html %}
{% endif %}
<!-- Google Analytics (deferred until first interaction or idle) -->
<script>
  (function () {
    if (localStorage.getItem("osawa.analytics.ga4.optout") === "1") return;

    var GA_ID = "G-HCEG8X3DQT";
    var loaded = false;
    var events = ["scroll", "mousemove", "touchstart", "keydown", "click"];

    function loadGA() {
      if (loaded) return;
      loaded = true;
      events.forEach(function (e) { window.removeEventListener(e, loadGA); });

      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
      document.head.appendChild(s);

      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag("js", new Date());
      gtag("config", GA_ID);
    }

    events.forEach(function (e) { window.addEventListener(e, loadGA, { passive: true }); });

    window.addEventListener("pagehide", function () {
      events.forEach(function (e) { window.removeEventListener(e, loadGA); });
    }, { once: true });
  })();
</script>
</head>

<body>
<div class="page-wrapper">
{% include header.html %}

<main id="main-content" class="page-content">
{{ content }}
</main>

{% include footer.html %}
</div>
</body>
</html>
